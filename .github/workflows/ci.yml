name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile All Workspace Packages
        run: npm run build

      - name: Typecheck Entire Monorepo
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Validate 500-Component Library & DAG
        run: npm run validate:library

      - name: Verify VS Code Extension Bundling
        run: npm run vscode:bundle
